server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin proxy to the backend — mirrors what Vite's dev-server
    # proxy does for `npm run dev` (see README), so the frontend never needs
    # to know the backend's real address and CORS stays a non-issue.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing (React Router) — any path that isn't a real file
    # falls back to index.html instead of a raw nginx 404.
    location / {
        try_files $uri /index.html;
    }
}
